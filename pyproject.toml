[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsBrowser"
version = "0.1.0"
description = "DeepSeek Browser Automation Agent"
authors = [{name = "Wu_RH"}]
# 注释掉或删除 readme 行（因为没有 README.md）
# readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "colorama>=0.4.6",
]

[tool.setuptools.packages.find]
# 只包含 ds 包及其子包，排除其他顶级目录
include = ["ds*"]
# 或者显式排除非包目录
# exclude = ["logs*", "prompt*", "session*"]